id: forager_1944
name: Operation Forager 1944
description: >
  July 1944. Saipan has fallen and Isley Field is operational. Task Force 58 and the Seventh
  Air Force now turn on Guam, Tinian and Rota. NOTE: pydcs has no Marianas WWII terrain and
  DCS has no Japanese aircraft; see docs/DECISIONS.md items 2 and 3 for the stand-ins used.
