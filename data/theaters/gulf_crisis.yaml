id: gulf_crisis
name: Persian Gulf Crisis
description: >
  Present day. The (fictional) Farsian Republic closes the Strait of Hormuz and lands troops
  on the Musandam peninsula. A US-led coalition fights to reopen the strait against a modern
  integrated air defence system. The DCS country "Iran" is used for the fictional power.
